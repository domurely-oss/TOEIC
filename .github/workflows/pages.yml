name: Deploy TOEIC to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate and prepare website
        run: |
          mkdir -p _site
          for file in index.html app.js speech.js navigation.js; do
            test -s "$file" || { echo "Missing website file: $file"; exit 1; }
            cp "$file" _site/
          done
          touch _site/.nojekyll
          for file in _site/*.js; do node --check "$file"; done
      - name: Upload website artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site
          retention-days: 7
      - name: Check upload result
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          test -n "$ARTIFACT_ID" || { echo "Upload did not return an artifact ID"; exit 1; }
          echo "Website artifact uploaded: $ARTIFACT_ID"
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
